<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsPilot</title>
<style>
:root {
  --bg:#f6f7f9; --surface:#ffffff; --text:#1b1f24; --muted:#667085; --border:#e4e7ec;
  --primary:#2563eb; --primary-text:#ffffff; --danger:#d92d20; --warn:#dc6803; --ok:#067647;
  --chart-other:#c7d2e0; --code-bg:#f2f4f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1318; --surface:#171c23; --text:#e6e9ee; --muted:#98a2b3; --border:#2a313b;
    --primary:#5b8def; --primary-text:#0b1220; --danger:#f97066; --warn:#fdb022; --ok:#47cd89;
    --chart-other:#3a4656; --code-bg:#1f2630;
  }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
a { color:var(--primary); text-decoration:none; }
a:hover { text-decoration:underline; }
header { background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
.bar { max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { font-weight:700; font-size:18px; color:var(--text); }
nav { display:flex; gap:4px; overflow-x:auto; flex:1; }
nav a { padding:6px 12px; border-radius:8px; color:var(--muted); white-space:nowrap; }
nav a.active { background:var(--code-bg); color:var(--text); font-weight:600; }
nav a:hover { text-decoration:none; color:var(--text); }
.who { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:10px; }
main { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:22px; margin:0 0 16px; }
h2 { font-size:17px; margin:24px 0 10px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.stat .label { color:var(--muted); font-size:13px; }
.stat .value { font-size:28px; font-weight:700; margin-top:2px; }
.stat .value.danger { color:var(--danger); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.spacer { flex:1; }
input, select, button { font:inherit; }
input, select { background:var(--surface); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px; min-width:0; }
input:focus, select:focus, button:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
button { background:var(--primary); color:var(--primary-text); border:0; border-radius:8px;
  padding:8px 14px; cursor:pointer; font-weight:600; }
button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
button.danger { background:var(--danger); color:#fff; }
button:disabled { opacity:.55; cursor:not-allowed; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:13px; white-space:nowrap; }
td.msg { white-space:pre-wrap; word-break:break-word; min-width:220px; }
td.nowrap { white-space:nowrap; }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600;
  border:1px solid var(--border); background:var(--code-bg); color:var(--muted); }
.badge.ERROR, .badge.high, .badge.critical, .badge.CRITICAL { color:var(--danger); border-color:var(--danger); }
.badge.WARNING, .badge.medium { color:var(--warn); border-color:var(--warn); }
.badge.resolved, .badge.INFO, .badge.low { color:var(--ok); border-color:var(--ok); }
.error { background:var(--surface); border:1px solid var(--danger); color:var(--danger);
  border-radius:8px; padding:10px 12px; margin:10px 0; }
.notice { background:var(--surface); border:1px solid var(--ok); border-radius:8px; padding:12px; margin:10px 0; }
.muted { color:var(--muted); }
code, .code { background:var(--code-bg); border-radius:6px; padding:2px 6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; word-break:break-all; }
.auth { max-width:380px; margin:8vh auto; padding:0 16px; }
.auth form { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
.auth label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
.tabs { display:flex; gap:6px; }
.tabs button { flex:1; }
.pager { display:flex; align-items:center; gap:10px; margin-top:12px; }
ol.fixes { padding-left:22px; margin:6px 0; } ol.fixes li { margin:6px 0; }
svg.chart { width:100%; height:auto; display:block; }
.legend { display:flex; gap:16px; font-size:13px; color:var(--muted); margin-top:6px; }
.dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
@media (max-width: 600px) {
  .stat .value { font-size:24px; }
  .who span { display:none; }
}

/* ---------- OpsPilot dark observability design refresh ---------- */
:root {
  color-scheme: dark;
  --bg:#0b1020; --surface:#111a2e; --text:#e8eefb; --muted:#91a0bb; --border:#26334d;
  --primary:#6d8cff; --primary-text:#fff; --danger:#ff667d; --warn:#f6b85b; --ok:#35d6a0;
  --chart-other:#53698e; --code-bg:#17243b;
}
@media (prefers-color-scheme: light) { :root { color-scheme:dark; } }
body { background:radial-gradient(ellipse at 80% -20%,rgba(67,98,180,.16),transparent 42%),var(--bg); color:var(--text); }
#app { min-height:100vh; }
.shell { min-height:100vh; display:grid; grid-template-columns:246px minmax(0,1fr); }
.sidebar { background:#0d1527; border-right:1px solid #202d45; padding:26px 17px 18px; display:flex; flex-direction:column; min-height:100vh; position:sticky; top:0; height:100vh; }
.brand { display:flex; align-items:center; gap:11px; color:#f4f7ff; font-size:19px; letter-spacing:-.4px; padding:0 10px 35px; }
.brand:hover { text-decoration:none; }
.brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; color:#fff; font-weight:800; background:linear-gradient(135deg,#6489ff,#8b5cf6); box-shadow:0 5px 22px #526fff55; }
.side-caption { color:#647493; font-size:10px; font-weight:800; letter-spacing:1.5px; padding:0 12px 11px; }
.sidebar nav { display:flex; flex-direction:column; gap:6px; }
.sidebar nav a { display:flex; align-items:center; gap:13px; padding:11px 12px; border-radius:9px; color:#91a0bb; font-size:14px; transition:background .15s,color .15s; }
.sidebar nav a:hover { color:#edf2ff; background:#17243b; text-decoration:none; }
.sidebar nav a.active { color:#fff; background:linear-gradient(90deg,#263d70,#1b2b4a); box-shadow:inset 3px 0 #7b9aff; font-weight:650; }
.nav-glyph { display:inline-grid; place-items:center; width:19px; font-size:19px; color:#8da7e8; }
.sidebar-bottom { margin-top:auto; border:1px solid #263650; border-radius:10px; padding:13px 12px; color:#b6c3dc; font-size:12px; display:grid; grid-template-columns:10px 1fr; align-items:center; gap:4px 8px; }
.sidebar-bottom small { grid-column:2; color:#7183a3; font-size:11px; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#35d6a0; box-shadow:0 0 12px #35d6a088; }
.workspace { min-width:0; }
.topbar { min-height:67px; border-bottom:1px solid #202d45; display:flex; justify-content:space-between; align-items:center; padding:0 34px; background:#0d1527cc; }
.topbar-context { color:#7585a4; font-size:10px; font-weight:800; letter-spacing:1.35px; }
.topbar-context span { color:#c3cee4; }
.who { color:#aab7d0; font-size:12px; display:flex; align-items:center; gap:10px; }
.account-avatar { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; color:#a9bdff; background:#25385f; font-size:11px; }
main { width:100%; max-width:1500px; margin:0 auto; padding:32px 36px 56px; }
h1 { font-size:27px; line-height:1.2; letter-spacing:-.65px; margin:0 0 22px; color:#f3f6ff; }
h2 { font-size:16px; letter-spacing:-.15px; margin:29px 0 13px; color:#dce6fa; }
.muted,.stat .label { color:#91a0bb; }
.card { background:linear-gradient(145deg,#141f35,#111a2e); border:1px solid #293752; border-radius:13px; padding:19px; box-shadow:0 8px 28px #03081725; }
.grid { grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:15px; }
.stat { min-height:116px; position:relative; overflow:hidden; }
.stat:after { content:''; position:absolute; width:76px; height:76px; right:-25px; top:-27px; border-radius:50%; background:#6d8cff12; }
.stat .label { font-size:12px; font-weight:600; letter-spacing:.2px; }
.stat .value { font-size:32px; line-height:1.25; margin-top:12px; color:#f2f6ff; letter-spacing:-1px; }
.stat .value.danger { color:var(--danger); }
input,select { background:#0e1729; color:var(--text); border:1px solid #30405e; border-radius:9px; padding:10px 12px; min-height:41px; }
input::placeholder { color:#71819f; }
input:focus,select:focus,button:focus-visible { outline:2px solid #7695ff; outline-offset:2px; }
button { background:linear-gradient(135deg,#6385ff,#526fe0); color:#fff; border:1px solid #7895ff55; border-radius:9px; padding:9px 15px; box-shadow:0 4px 12px #4e70df22; }
button:hover { filter:brightness(1.1); }
button.secondary { background:#17243b; color:#d6e0f4; border:1px solid #344461; box-shadow:none; }
button.danger { background:#6b263b; border-color:#a63c56; }
.table-wrap { border-radius:9px; }
table { border-collapse:separate; border-spacing:0; }
th { color:#8495b4; background:#101a2d; font-size:11px; letter-spacing:.65px; text-transform:uppercase; padding:12px 13px; }
td { color:#cbd6eb; padding:13px; border-bottom:1px solid #26334b; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover td { background:#1a2942; }
.badge { padding:3px 9px; border-radius:6px; font-size:10px; letter-spacing:.35px; text-transform:uppercase; background:#263650; border-color:#3a4e70; color:#b7c7e4; }
.badge.ERROR,.badge.high,.badge.critical,.badge.CRITICAL { color:#ff8c9d; background:#482638; border-color:#774052; }
.badge.WARNING,.badge.medium { color:#ffd18a; background:#493a27; border-color:#765b34; }
.badge.resolved,.badge.INFO,.badge.low { color:#70e3bb; background:#173d3a; border-color:#28645b; }
.error { background:#3d1e2c; border-color:#a33f59; color:#ff9aab; }
.notice { background:#15372f; border-color:#287c66; color:#a4f0d6; }
code,.code { background:#0b1425; color:#b6c9f4; border:1px solid #2c3d5d; border-radius:6px; padding:3px 7px; }
.auth { max-width:420px; margin:10vh auto; padding:30px; border:1px solid #293752; border-radius:16px; background:#111a2e; box-shadow:0 24px 80px #03081766; }
.auth h1 { font-size:30px; margin-bottom:7px; }
.auth .tabs { margin:24px 0 14px; }
.auth label { color:#a4b3ce; }
.auth input { width:100%; }
.auth form { gap:14px; }
.auth form button { min-height:44px; }
.pager { color:#91a0bb; }
.legend { color:#aab8d1; }
.dot { border-radius:3px; }
@media (max-width:850px) {
 .shell { grid-template-columns:1fr; }
 .sidebar { position:relative; height:auto; min-height:0; padding:14px 16px 10px; border-right:0; border-bottom:1px solid #202d45; }
 .brand { padding:0 5px 13px; }
 .side-caption,.sidebar-bottom { display:none; }
 .sidebar nav { flex-direction:row; overflow-x:auto; }
 .sidebar nav a { padding:9px 11px; }
 .topbar { min-height:55px; padding:0 18px; }
 main { padding:25px 20px 40px; }
}
@media (max-width:560px) {
 .topbar-context { display:none; }
 .topbar { justify-content:flex-end; }
 main { padding:22px 14px 34px; }
 .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
 .stat { padding:14px; min-height:100px; }
 .stat .value { font-size:26px; }
 .auth { margin:7vh 14px; padding:23px; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const app = document.getElementById('app');
const TOKEN_KEY = 'opspilot_token';
const state = { email: null, hours: 24, logs: { q: '', level: '', source: '', page: 0 }, incStatus: '' };
const PAGE_SIZE = 25;

/* ---------- tiny DOM helper: builds nodes from text only, so untrusted log content can never become markup ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const svg = (tag, attrs, ...kids) => {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};

/* ---------- helpers ---------- */
const getToken = () => localStorage.getItem(TOKEN_KEY);
function fmtTime(iso) {
  if (!iso) return '';
  if (!/(Z|[+-]\d\d:?\d\d)$/i.test(iso)) iso += 'Z'; // SQLite returns naive UTC timestamps
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleString();
}
const badge = (text, cls) => h('span', { class: 'badge ' + (cls || text) }, text);
const errorBox = (msg) => h('div', { class: 'error', role: 'alert' }, msg);
function errMsg(d) {
  if (!d) return null;
  if (typeof d.detail === 'string') return d.detail;
  if (Array.isArray(d.detail)) return d.detail.map(e => (e.loc || []).slice(1).join('.') + ': ' + e.msg).join('; ');
  return null;
}
async function api(path, { method = 'GET', body, form, auth = true } = {}) {
  const headers = {};
  if (auth && getToken()) headers.Authorization = 'Bearer ' + getToken();
  let payload;
  if (form) {
    headers['Content-Type'] = 'application/x-www-form-urlencoded';
    payload = new URLSearchParams(form).toString();
  } else if (body !== undefined) {
    headers['Content-Type'] = 'application/json';
    payload = JSON.stringify(body);
  }
  const res = await fetch(path, { method, headers, body: payload });
  if (res.status === 401 && auth) { logout(); throw new Error('Session expired. Please sign in again.'); }
  if (res.status === 204) return { data: null, res };
  let data = null;
  try { data = await res.json(); } catch (_) { /* no body */ }
  if (!res.ok) throw new Error(errMsg(data) || 'Request failed (' + res.status + ')');
  return { data, res };
}

/* ---------- auth ---------- */
function logout() {
  localStorage.removeItem(TOKEN_KEY);
  state.email = null;
  location.hash = '#/login';
  route();
}
function renderAuth() {
  let mode = 'login';
  const msg = h('div');
  const email = h('input', { type: 'email', id: 'email', autocomplete: 'username', required: true });
  const password = h('input', { type: 'password', id: 'password', autocomplete: 'current-password', required: true, minlength: 8 });
  const submit = h('button', { type: 'submit', id: 'auth-submit' }, 'Sign in');
  const tabLogin = h('button', { type: 'button', class: '', id: 'tab-login', onclick: () => setMode('login') }, 'Sign in');
  const tabReg = h('button', { type: 'button', class: 'secondary', id: 'tab-register', onclick: () => setMode('register') }, 'Create account');
  function setMode(m) {
    mode = m;
    tabLogin.className = m === 'login' ? '' : 'secondary';
    tabReg.className = m === 'register' ? '' : 'secondary';
    submit.textContent = m === 'login' ? 'Sign in' : 'Create account';
    password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    msg.replaceChildren();
  }
  const form = h('form', {
    onsubmit: async (e) => {
      e.preventDefault();
      msg.replaceChildren();
      submit.disabled = true;
      try {
        if (mode === 'register') {
          await api('/api/v1/auth/register', { method: 'POST', auth: false, body: { email: email.value.trim(), password: password.value } });
        }
        const { data } = await api('/api/v1/auth/login', { method: 'POST', auth: false, form: { username: email.value.trim(), password: password.value } });
        localStorage.setItem(TOKEN_KEY, data.access_token);
        state.email = null;
        location.hash = '#/dashboard';
        route();
      } catch (err) {
        msg.replaceChildren(errorBox(err.message));
      } finally {
        submit.disabled = false;
      }
    },
  },
    h('label', {}, 'Email', email),
    h('label', {}, 'Password (min 8 characters)', password),
    submit, msg);
  app.replaceChildren(h('div', { class: 'auth' },
    h('h1', {}, 'OpsPilot'),
    h('p', { class: 'muted' }, 'Log monitoring and AI incident analysis.'),
    h('div', { class: 'tabs' }, tabLogin, tabReg),
    form));
}

/* ---------- shell ---------- */
const NAV = [['#/dashboard', 'Dashboard'], ['#/logs', 'Logs'], ['#/incidents', 'Incidents'], ['#/keys', 'API keys']];
function renderShell(path) {
  const who = h('span', { id: 'who' }, state.email || 'Loading account…');
  const links = NAV.map(([href, label]) =>
    h('a', { href, class: path.startsWith(href.slice(1)) ? 'active' : '' },
      h('span', { class: 'nav-glyph', 'aria-hidden': 'true' }, ({ Dashboard: '◫', Logs: '≋', Incidents: '⚑', 'API keys': '⌘' })[label]),
      h('span', {}, label)));
  app.replaceChildren(
    h('div', { class: 'shell' },
      h('aside', { class: 'sidebar' },
        h('a', { class: 'brand', href: '#/dashboard' }, h('span', { class: 'brand-mark' }, 'O'), h('span', {}, 'OpsPilot')),
        h('div', { class: 'side-caption' }, 'WORKSPACE'),
        h('nav', { 'aria-label': 'Main' }, links),
        h('div', { class: 'sidebar-bottom' },
          h('span', { class: 'live-dot' }), h('span', {}, 'Monitoring workspace'),
          h('small', {}, 'Incident intelligence'))),
      h('section', { class: 'workspace' },
        h('header', { class: 'topbar' },
          h('div', { class: 'topbar-context' }, 'OBSERVABILITY', h('span', {}, ' / ' + (NAV.find(([href]) => path.startsWith(href.slice(1))) || NAV[0])[1].toUpperCase())),
          h('div', { class: 'who' }, h('span', { class: 'account-avatar' }, '●'), who,
            h('button', { class: 'secondary', id: 'logout', onclick: logout }, 'Log out'))),
        h('main', { id: 'main' }))));
  if (!state.email) {
    api('/api/v1/auth/me').then(({ data }) => { state.email = data.email; who.textContent = data.email; }).catch(() => {});
  }
  return document.getElementById('main');
}

/* ---------- dashboard ---------- */
function barChart(points) {
  const W = 720, H = 220, L = 36, B = 22, T = 8, R = 6;
  const max = Math.max(1, ...points.map(p => p.total));
  const bw = (W - L - R) / points.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  const root = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Log volume and errors over time' });
  for (const frac of [0, 0.5, 1]) {
    const v = Math.round(max * frac);
    root.append(svg('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), style: 'stroke:var(--border)' }));
    root.append(svg('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, style: 'fill:var(--muted)' }, v));
  }
  points.forEach((p, i) => {
    const x = L + i * bw + 1, w = Math.max(1, bw - 2);
    const other = p.total - p.errors;
    const g = svg('g', {}, svg('title', {}, `${fmtTime(p.start)}: ${p.total} logs, ${p.errors} errors`));
    if (other > 0) g.append(svg('rect', { x, y: y(other), width: w, height: y(0) - y(other), style: 'fill:var(--chart-other)' }));
    if (p.errors > 0) g.append(svg('rect', { x, y: y(p.total), width: w, height: y(other) - y(p.total), style: 'fill:var(--danger)' }));
    root.append(g);
  });
  const first = points[0], last = points[points.length - 1];
  root.append(svg('text', { x: L, y: H - 6, 'font-size': 11, style: 'fill:var(--muted)' }, fmtTime(first.start)));
  root.append(svg('text', { x: W - R, y: H - 6, 'font-size': 11, 'text-anchor': 'end', style: 'fill:var(--muted)' }, fmtTime(last.start)));
  return root;
}
function statCard(label, value, danger) {
  return h('div', { class: 'card stat' }, h('div', { class: 'label' }, label), h('div', { class: 'value' + (danger ? ' danger' : '') }, value));
}
async function viewDashboard(main) {
  main.replaceChildren(h('h1', {}, 'Dashboard'), h('p', { class: 'muted' }, 'Loading…'));
  const [stats, ts, open, recent] = await Promise.all([
    api('/api/v1/logs/stats'),
    api('/api/v1/logs/timeseries?hours=' + state.hours),
    api('/api/v1/incidents?status=open&limit=200'),
    api('/api/v1/logs?level=ERROR&limit=5'),
  ]);
  const by = stats.data.by_level;
  const errors = (by.ERROR || 0) + (by.CRITICAL || 0);
  const windowErrors = ts.data.points.reduce((a, p) => a + p.errors, 0);
  const windowTotal = ts.data.points.reduce((a, p) => a + p.total, 0);
  const hoursSel = h('select', { id: 'hours', 'aria-label': 'Time range', onchange: (e) => { state.hours = +e.target.value; route(); } },
    [[1, 'Last hour'], [6, 'Last 6 hours'], [24, 'Last 24 hours'], [72, 'Last 3 days'], [168, 'Last 7 days']]
      .map(([v, l]) => h('option', { value: v, selected: v === state.hours }, l)));
  main.replaceChildren(
    h('div', { class: 'row' }, h('h1', {}, 'Dashboard'), h('span', { class: 'spacer' }), hoursSel),
    h('div', { class: 'grid', id: 'stats' },
      statCard('Total logs', stats.data.total),
      statCard('Errors (all time)', errors, errors > 0),
      statCard('Critical', by.CRITICAL || 0, (by.CRITICAL || 0) > 0),
      statCard('Open incidents', open.data.length, open.data.length > 0)),
    h('h2', {}, 'Logs and errors over time'),
    h('div', { class: 'card' },
      windowTotal === 0 ? h('p', { class: 'muted' }, 'No logs in this time range yet. Send some with an API key.') : barChart(ts.data.points),
      h('div', { class: 'legend' },
        h('span', {}, h('span', { class: 'dot', style: 'background:var(--chart-other)' }), 'Other logs'),
        h('span', {}, h('span', { class: 'dot', style: 'background:var(--danger)' }), 'Errors'),
        h('span', { class: 'spacer' }),
        h('span', {}, `${windowTotal} logs, ${windowErrors} errors in range`))),
    h('h2', {}, 'Latest errors'),
    h('div', { class: 'card' }, recent.data.length === 0
      ? h('p', { class: 'muted' }, 'No errors. 🎉')
      : logTable(recent.data)));
}

/* ---------- logs ---------- */
function logTable(rows) {
  return h('div', { class: 'table-wrap' }, h('table', {},
    h('thead', {}, h('tr', {}, ['Time', 'Level', 'Source', 'Message'].map(t => h('th', {}, t)))),
    h('tbody', {}, rows.map(r => h('tr', {},
      h('td', { class: 'nowrap' }, fmtTime(r.timestamp)),
      h('td', {}, badge(r.level)),
      h('td', {}, r.source),
      h('td', { class: 'msg' }, r.message))))));
}
async function viewLogs(main) {
  const f = state.logs;
  const q = h('input', { type: 'search', id: 'q', placeholder: 'Search messages…', value: f.q, 'aria-label': 'Search messages' });
  const level = h('select', { id: 'level', 'aria-label': 'Level' },
    [['', 'All levels'], ['DEBUG', 'DEBUG'], ['INFO', 'INFO'], ['WARNING', 'WARNING'], ['ERROR', 'ERROR'], ['CRITICAL', 'CRITICAL']]
      .map(([v, l]) => h('option', { value: v, selected: v === f.level }, l)));
  const source = h('input', { type: 'text', id: 'source', placeholder: 'Source (exact)', value: f.source, 'aria-label': 'Source' });
  const result = h('div', { id: 'log-results' });
  const apply = (e) => { e.preventDefault(); f.q = q.value.trim(); f.level = level.value; f.source = source.value.trim(); f.page = 0; load(); };
  main.replaceChildren(h('h1', {}, 'Log explorer'),
    h('form', { class: 'row', id: 'log-filter', onsubmit: apply }, q, level, source, h('button', { type: 'submit' }, 'Search')),
    result);
  async function load() {
    result.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
    const p = new URLSearchParams({ limit: PAGE_SIZE, offset: f.page * PAGE_SIZE });
    if (f.q) p.set('q', f.q);
    if (f.level) p.set('level', f.level);
    if (f.source) p.set('source', f.source);
    try {
      const { data, res } = await api('/api/v1/logs?' + p);
      const total = +res.headers.get('X-Total-Count') || 0;
      const from = total === 0 ? 0 : f.page * PAGE_SIZE + 1, to = f.page * PAGE_SIZE + data.length;
      result.replaceChildren(
        h('div', { class: 'card', style: 'margin-top:12px' }, data.length ? logTable(data) : h('p', { class: 'muted' }, 'No logs match.')),
        h('div', { class: 'pager' },
          h('button', { class: 'secondary', id: 'prev', disabled: f.page === 0, onclick: () => { f.page--; load(); } }, '← Previous'),
          h('button', { class: 'secondary', id: 'next', disabled: to >= total, onclick: () => { f.page++; load(); } }, 'Next →'),
          h('span', { class: 'muted', id: 'range' }, `Showing ${from}–${to} of ${total}`)));
    } catch (e) { result.replaceChildren(errorBox(e.message)); }
  }
  await load();
}

/* ---------- incidents ---------- */
async function viewIncidents(main) {
  const [patterns, incidents] = await Promise.all([
    api('/api/v1/incidents/patterns?hours=24&limit=20'),
    api('/api/v1/incidents?limit=100' + (state.incStatus ? '&status=' + state.incStatus : '')),
  ]);
  const msg = h('div');
  const analyze = async (btn, fp) => {
    btn.disabled = true; msg.replaceChildren();
    try {
      const { data } = await api('/api/v1/incidents/analyze', { method: 'POST', body: { fingerprint: fp, hours: 24 } });
      location.hash = '#/incidents/' + data.id;
    } catch (e) { msg.replaceChildren(errorBox(e.message)); btn.disabled = false; }
  };
  const statusSel = h('select', { id: 'inc-status', 'aria-label': 'Status filter', onchange: (e) => { state.incStatus = e.target.value; route(); } },
    [['', 'All'], ['open', 'Open'], ['resolved', 'Resolved']].map(([v, l]) => h('option', { value: v, selected: v === state.incStatus }, l)));
  main.replaceChildren(
    h('h1', {}, 'Incidents'),
    msg,
    h('h2', {}, 'Detected error patterns (last 24h)'),
    h('div', { class: 'card' }, patterns.data.length === 0
      ? h('p', { class: 'muted' }, 'No recurring errors detected.')
      : h('div', { class: 'table-wrap' }, h('table', { id: 'patterns' },
        h('thead', {}, h('tr', {}, ['Pattern', 'Count', 'Sources', 'Last seen', ''].map(t => h('th', {}, t)))),
        h('tbody', {}, patterns.data.map(p => {
          const btn = h('button', { onclick: () => analyze(btn, p.fingerprint) }, 'Analyze');
          return h('tr', {},
            h('td', { class: 'msg' }, h('span', { class: 'code' }, p.template)),
            h('td', {}, p.count),
            h('td', {}, p.sources.slice(0, 3).join(', ') + (p.sources.length > 3 ? ' +' + (p.sources.length - 3) : '')),
            h('td', { class: 'nowrap' }, fmtTime(p.last_seen)),
            h('td', {}, btn));
        }))))),
    h('div', { class: 'row' }, h('h2', {}, 'Incident history'), h('span', { class: 'spacer' }), statusSel),
    h('div', { class: 'card' }, incidents.data.length === 0
      ? h('p', { class: 'muted' }, 'No incidents yet. Analyze a pattern above to create one.')
      : h('div', { class: 'table-wrap' }, h('table', { id: 'incident-list' },
        h('thead', {}, h('tr', {}, ['Incident', 'Severity', 'Status', 'Events', 'Last seen'].map(t => h('th', {}, t)))),
        h('tbody', {}, incidents.data.map(i => h('tr', {},
          h('td', { class: 'msg' }, h('a', { href: '#/incidents/' + i.id }, i.title)),
          h('td', {}, badge(i.severity)),
          h('td', {}, badge(i.status)),
          h('td', {}, i.log_count),
          h('td', { class: 'nowrap' }, fmtTime(i.last_seen)))))))));
}
async function viewIncident(main, id) {
  const { data: i } = await api('/api/v1/incidents/' + id);
  const msg = h('div');
  const setStatus = async (status) => {
    try { await api('/api/v1/incidents/' + id, { method: 'PATCH', body: { status } }); route(); }
    catch (e) { msg.replaceChildren(errorBox(e.message)); }
  };
  const reanalyze = async (btn) => {
    btn.disabled = true; msg.replaceChildren();
    try { await api('/api/v1/incidents/analyze', { method: 'POST', body: { fingerprint: i.fingerprint, hours: 24 } }); route(); }
    catch (e) { msg.replaceChildren(errorBox(e.message)); btn.disabled = false; }
  };
  const reBtn = h('button', { class: 'secondary', onclick: () => reanalyze(reBtn) }, 'Re-run analysis');
  main.replaceChildren(
    h('p', {}, h('a', { href: '#/incidents' }, '← All incidents')),
    h('div', { class: 'row' }, h('h1', { id: 'inc-title' }, i.title), badge(i.severity), badge(i.status)),
    msg,
    h('div', { class: 'card' },
      h('p', { class: 'muted' }, `${i.log_count} events · ${fmtTime(i.first_seen)} → ${fmtTime(i.last_seen)} · sources: ${i.affected_sources.join(', ')}`),
      h('h2', { style: 'margin-top:8px' }, 'Summary'), h('p', {}, i.summary),
      h('h2', {}, 'Likely root cause'), h('p', { id: 'root-cause' }, i.root_cause),
      h('h2', {}, 'Recommended fixes'), h('ol', { class: 'fixes', id: 'fixes' }, i.recommended_fixes.map(f => h('li', {}, f))),
      h('p', { class: 'muted', style: 'margin-top:16px' },
        i.analysis_source === 'claude' ? `Analysis by Claude (${i.analysis_model})` : 'Analysis by built-in rule engine',
        ` · analyzed ${fmtTime(i.analyzed_at)}`)),
    h('div', { class: 'row', style: 'margin-top:12px' },
      i.status === 'open'
        ? [h('button', { id: 'resolve', onclick: () => setStatus('resolved') }, 'Mark resolved'), reBtn]
        : h('button', { class: 'secondary', id: 'reopen', onclick: () => setStatus('open') }, 'Reopen')));
}

/* ---------- API keys ---------- */
async function viewKeys(main) {
  const { data: keys } = await api('/api/v1/api-keys');
  const msg = h('div');
  const name = h('input', { type: 'text', id: 'key-name', placeholder: 'Key name, e.g. prod-server-1', maxlength: 100, required: true, 'aria-label': 'Key name' });
  const create = async (e) => {
    e.preventDefault(); msg.replaceChildren();
    try {
      const { data } = await api('/api/v1/api-keys', { method: 'POST', body: { name: name.value.trim() } });
      const copy = h('button', { class: 'secondary', onclick: async () => {
        try { await navigator.clipboard.writeText(data.key); copy.textContent = 'Copied'; } catch (_) { copy.textContent = 'Copy failed'; }
      } }, 'Copy');
      await viewKeys(main);
      main.querySelector('#key-msg').replaceChildren(h('div', { class: 'notice', id: 'new-key' },
        h('strong', {}, 'Copy your key now. It will not be shown again.'),
        h('p', {}, h('span', { class: 'code', id: 'new-key-value' }, data.key)), copy,
        h('p', { class: 'muted' }, 'Send logs with the header ', h('code', {}, 'X-API-Key: <key>'), '.')));
    } catch (err) { msg.replaceChildren(errorBox(err.message)); }
  };
  const revoke = async (k) => {
    if (!confirm(`Revoke key "${k.name}"? Agents using it will stop working.`)) return;
    try { await api('/api/v1/api-keys/' + k.id, { method: 'DELETE' }); route(); }
    catch (err) { msg.replaceChildren(errorBox(err.message)); }
  };
  main.replaceChildren(
    h('h1', {}, 'API keys'),
    h('p', { class: 'muted' }, 'Keys let servers and agents send logs without a password.'),
    h('form', { class: 'row', onsubmit: create }, name, h('button', { type: 'submit' }, 'Create key')),
    h('div', { id: 'key-msg' }), msg,
    h('div', { class: 'card', style: 'margin-top:12px' }, keys.length === 0
      ? h('p', { class: 'muted' }, 'No API keys yet.')
      : h('div', { class: 'table-wrap' }, h('table', { id: 'key-list' },
        h('thead', {}, h('tr', {}, ['Name', 'Key prefix', 'Created', 'Status', ''].map(t => h('th', {}, t)))),
        h('tbody', {}, keys.map(k => h('tr', {},
          h('td', {}, k.name), h('td', {}, h('span', { class: 'code' }, k.prefix + '…')),
          h('td', { class: 'nowrap' }, fmtTime(k.created_at)),
          h('td', {}, k.revoked ? badge('revoked', 'ERROR') : badge('active', 'resolved')),
          h('td', {}, k.revoked ? '' : h('button', { class: 'danger', onclick: () => revoke(k) }, 'Revoke')))))))));
}

/* ---------- router ---------- */
const routes = [
  [/^\/dashboard$/, viewDashboard], [/^\/logs$/, viewLogs], [/^\/incidents$/, viewIncidents],
  [/^\/incidents\/(\d+)$/, viewIncident], [/^\/keys$/, viewKeys],
];
async function route() {
  const path = (location.hash || '#/dashboard').slice(1);
  if (!getToken()) { renderAuth(); return; }
  for (const [rx, fn] of routes) {
    const m = path.match(rx);
    if (m) {
      const main = renderShell(path);
      try { await fn(main, ...m.slice(1)); } catch (e) { main.replaceChildren(errorBox(e.message)); }
      return;
    }
  }
  location.hash = '#/dashboard';
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
